<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" width="560" height="440" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="560" height="440" rx="16" fill="#140a26"/>
  <text x="280" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">A query — intersect, union, or timeline</text>
  <text x="280" y="56" text-anchor="middle" font-size="13" fill="#c4b5fd">intersection shown:  person:Sarah  ∩  topic:database  ∩  decision:postgres</text>

  <!-- three property sets -->
  <g stroke="#c4b5fd" stroke-width="1.5">
    <circle cx="280" cy="198" r="105" fill="#8b5cf6" fill-opacity="0.5"/>
    <circle cx="235" cy="286" r="105" fill="#a78bfa" fill-opacity="0.5"/>
    <circle cx="325" cy="286" r="105" fill="#7c3aed" fill-opacity="0.5"/>
  </g>

  <!-- set labels -->
  <text x="280" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">person:Sarah</text>
  <text x="148" y="400" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">topic:database</text>
  <text x="432" y="400" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">decision:postgres</text>

  <!-- scattered SRs in single/pair regions -->
  <g fill="#ffffff" fill-opacity="0.75">
    <circle cx="280" cy="150" r="5"/>
    <circle cx="175" cy="320" r="5"/>
    <circle cx="390" cy="320" r="5"/>
    <circle cx="235" cy="200" r="5"/>
    <circle cx="330" cy="205" r="5"/>
  </g>

  <!-- the SR in the triple intersection -->
  <circle cx="280" cy="262" r="9" fill="#ffd54a" stroke="#160d27" stroke-width="2"/>
  <line x1="289" y1="258" x2="430" y2="225" stroke="#ffd54a" stroke-width="1.2"/>
  <text x="430" y="212" font-size="11" font-weight="700" fill="#ffd54a">Exactly the source</text>
  <text x="430" y="226" font-size="11" font-weight="700" fill="#ffd54a">records needed</text>
  <text x="430" y="240" font-size="11" font-weight="700" fill="#ffd54a">by the agent</text>

  <text x="280" y="428" text-anchor="middle" font-size="12" fill="#c4b5fd">∩ intersect = the overlap   ·   ∪ union = any match   ·   ⏱ timeline = same sets, by time</text>
</svg>
