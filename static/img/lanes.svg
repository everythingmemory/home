<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 256" width="960" height="256" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="256" rx="16" fill="#140a26"/>
  <text x="490" y="26" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">Lanes — non-overlapping workspaces, connected by shared labels</text>

  <defs>
    <marker id="pa" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a78bfa"/></marker>
  </defs>

  <!-- lane bands -->
  <rect x="120" y="42" width="825" height="54" rx="12" fill="#1b1335" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="120" y="112" width="825" height="54" rx="12" fill="#0f1830" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="120" y="182" width="825" height="54" rx="12" fill="#11201a" stroke="#34d399" stroke-width="1.5"/>

  <!-- lane labels -->
  <text x="165" y="73" text-anchor="middle" font-size="12" font-weight="800" fill="#c4b5fd">crm</text>
  <text x="165" y="143" text-anchor="middle" font-size="12" font-weight="800" fill="#7dd3fc">ops</text>
  <text x="165" y="213" text-anchor="middle" font-size="12" font-weight="800" fill="#6ee7b7">people</text>

  <!-- profile -->
  <rect x="18" y="42" width="82" height="54" rx="12" fill="#5b2a86" stroke="#a78bfa" stroke-width="2"/>
  <text x="59" y="65" text-anchor="middle" font-size="16">🤖</text>
  <text x="59" y="83" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">sales</text>

  <rect x="18" y="112" width="82" height="124" rx="12" fill="#5b2a86" stroke="#a78bfa" stroke-width="2"/>
  <text x="59" y="169" text-anchor="middle" font-size="16">🤖</text>
  <text x="59" y="187" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">support</text>

  <g stroke="#a78bfa" stroke-width="1.6">
    <line x1="100" y1="69" x2="118" y2="69" marker-end="url(#pa)"/>
    <line x1="100" y1="139" x2="118" y2="139" marker-end="url(#pa)"/>
    <line x1="100" y1="209" x2="118" y2="209" marker-end="url(#pa)"/>
  </g>

  <!-- cross-lane shared-label links -->
  <g stroke="#ffd54a" stroke-width="1.8" stroke-dasharray="5 4" fill="none">
    <path d="M485,84 L360,124"/>
    <path d="M575,154 L650,194"/>
  </g>
  <text x="409" y="108" text-anchor="middle" font-size="10" font-weight="700" fill="#ffd54a">org:Acme</text>
  <text x="635" y="178" text-anchor="middle" font-size="10" font-weight="700" fill="#ffd54a">customer:ABC</text>

  <!-- crm chips -->
  <g font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">
    <rect x="258" y="54" width="104" height="30" rx="8" fill="#241a3a" stroke="#a78bfa" stroke-width="1.5"/><text x="310" y="73">📇 contact</text>
    <rect x="433" y="54" width="104" height="30" rx="8" fill="#241a3a" stroke="#a78bfa" stroke-width="1.5"/><text x="485" y="73">💼 deal</text>
    <rect x="603" y="54" width="104" height="30" rx="8" fill="#241a3a" stroke="#a78bfa" stroke-width="1.5"/><text x="655" y="73">📅 meeting</text>
    <rect x="773" y="54" width="104" height="30" rx="8" fill="#241a3a" stroke="#a78bfa" stroke-width="1.5"/><text x="825" y="73">📄 report</text>
  </g>

  <!-- ops chips -->
  <g font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">
    <rect x="308" y="124" width="104" height="30" rx="8" fill="#1a2433" stroke="#7dd3fc" stroke-width="1.5"/><text x="360" y="143">📁 project</text>
    <rect x="523" y="124" width="104" height="30" rx="8" fill="#1a2433" stroke="#7dd3fc" stroke-width="1.5"/><text x="575" y="143">🎫 ticket</text>
    <rect x="738" y="124" width="104" height="30" rx="8" fill="#1a2433" stroke="#7dd3fc" stroke-width="1.5"/><text x="790" y="143">🗓️ calendar</text>
  </g>

  <!-- people chips -->
  <g font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">
    <rect x="348" y="194" width="104" height="30" rx="8" fill="#15231b" stroke="#6ee7b7" stroke-width="1.5"/><text x="400" y="213">👤 employee</text>
    <rect x="598" y="194" width="104" height="30" rx="8" fill="#15231b" stroke="#6ee7b7" stroke-width="1.5"/><text x="650" y="213">🏢 customer</text>
  </g>
</svg>
