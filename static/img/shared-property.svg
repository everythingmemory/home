<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="600" height="300" rx="16" fill="#140a26"/>
  <text x="300" y="28" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">N-ary edges — one shared label connects many records</text>

  <!-- connecting lines (drawn first, behind) -->
  <g stroke="#7c3aed" stroke-width="1.4" opacity="0.55">
    <!-- org:Acme → all four -->
    <line x1="438" y1="96" x2="190" y2="78"/>
    <line x1="438" y1="96" x2="190" y2="128"/>
    <line x1="438" y1="96" x2="190" y2="178"/>
    <line x1="438" y1="96" x2="190" y2="228"/>
    <!-- person:Sarah → contact, meeting, deal -->
    <line x1="438" y1="162" x2="190" y2="78"/>
    <line x1="438" y1="162" x2="190" y2="128"/>
    <line x1="438" y1="162" x2="190" y2="178"/>
    <!-- topic:renewal → meeting, deal -->
    <line x1="438" y1="228" x2="190" y2="128"/>
    <line x1="438" y1="228" x2="190" y2="178"/>
  </g>

  <!-- source records (left) -->
  <g font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">
    <rect x="42" y="59"  width="148" height="38" rx="9" fill="#241a3a" stroke="#7c3aed" stroke-width="1.6"/><text x="116" y="83">📇 contact</text>
    <rect x="42" y="109" width="148" height="38" rx="9" fill="#241a3a" stroke="#7c3aed" stroke-width="1.6"/><text x="116" y="133">📅 meeting</text>
    <rect x="42" y="159" width="148" height="38" rx="9" fill="#241a3a" stroke="#7c3aed" stroke-width="1.6"/><text x="116" y="183">💼 deal</text>
    <rect x="42" y="209" width="148" height="38" rx="9" fill="#241a3a" stroke="#7c3aed" stroke-width="1.6"/><text x="116" y="233">📄 report</text>
  </g>

  <!-- label edges (right) -->
  <g font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle">
    <circle cx="478" cy="96"  r="40" fill="#7c3aed" stroke="#c4b5fd" stroke-width="1.8"/><text x="478" y="100">org:Acme</text>
    <circle cx="478" cy="162" r="40" fill="#7c3aed" stroke="#c4b5fd" stroke-width="1.8"/><text x="478" y="166">person:Sarah</text>
    <circle cx="478" cy="228" r="40" fill="#7c3aed" stroke="#c4b5fd" stroke-width="1.8"/><text x="478" y="232">topic:renewal</text>
  </g>
</svg>
