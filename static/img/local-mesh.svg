<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="640" height="340" rx="16" fill="#140a26"/>
  <text x="320" y="24" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">One memory, every surface — local engines, peered</text>

  <defs>
    <marker id="sa" markerWidth="9" markerHeight="7" refX="4.5" refY="3.5" orient="auto-start-reverse"><polygon points="0 0, 9 3.5, 0 7" fill="#c4b5fd"/></marker>
  </defs>

  <!-- bidirectional exchange between the two local eMemories -->
  <line x1="284" y1="155" x2="356" y2="155" stroke="#c4b5fd" stroke-width="2" marker-start="url(#sa)" marker-end="url(#sa)"/>
  <text x="320" y="146" text-anchor="middle" font-size="11" font-weight="700" fill="#c4b5fd">exchange</text>

  <!-- LOCAL eMemory #1 -->
  <circle cx="240" cy="155" r="42" fill="#160d27" stroke="#a78bfa" stroke-width="2.5"/>
  <text x="240" y="151" text-anchor="middle" font-size="18">🧠</text>
  <text x="240" y="169" text-anchor="middle" font-size="10" font-weight="800" fill="#ffffff">eMemory</text>

  <!-- LOCAL eMemory #2 -->
  <circle cx="400" cy="155" r="42" fill="#160d27" stroke="#a78bfa" stroke-width="2.5"/>
  <text x="400" y="151" text-anchor="middle" font-size="18">🧠</text>
  <text x="400" y="169" text-anchor="middle" font-size="10" font-weight="800" fill="#ffffff">eMemory</text>

  <!-- a local laptop beneath each sphere — on-premise machines, peered -->
  <text x="240" y="224" text-anchor="middle" font-size="11" font-weight="700" fill="#c4b5fd">💻 local</text>
  <text x="400" y="224" text-anchor="middle" font-size="11" font-weight="700" fill="#c4b5fd">💻 local</text>

  <!-- surfaces arrayed along the bottom, equidistant -->
  <g font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">
    <rect x="64" y="290" width="96" height="32" rx="9" fill="#241a3a" stroke="#a78bfa" stroke-width="1.5"/><text x="112" y="310">💻 Claude Code</text>
    <rect x="168" y="290" width="96" height="32" rx="9" fill="#0d1b2e" stroke="#38bdf8" stroke-width="1.5"/><text x="216" y="310">⌨️ Cursor</text>
    <rect x="272" y="290" width="96" height="32" rx="9" fill="#241a3a" stroke="#a78bfa" stroke-width="1.5"/><text x="320" y="310">🌐 Claude.ai</text>
    <rect x="376" y="290" width="96" height="32" rx="9" fill="#0d1b2e" stroke="#38bdf8" stroke-width="1.5"/><text x="424" y="310">🟩 Codex</text>
    <rect x="480" y="290" width="96" height="32" rx="9" fill="#0d1b2e" stroke="#38bdf8" stroke-width="1.5"/><text x="528" y="310">🦾 OpenClaw</text>
  </g>
</svg>
