# The plugin registry: the extractor services the pipeline can call.
# Details: https://everythingmemory.ai/docs/reference/advanced-settings/pipeline-and-plugins/

plugins:

  # Not in the shipped stack.
  json_leaf:
    type: extract
    url: http://plugin-json-leaf:8000/invoke
    health_url: http://plugin-json-leaf:8000/health
    timeout: 5
    retries: 1
    optional: true
    raw_input: true

  # Also read at question time by e_gather find, whatever the profile.
  wordnet:
    type: extract
    url: http://plugin-wordnet:8000/invoke
    health_url: http://plugin-wordnet:8000/health
    timeout: 5
    retries: 1
    optional: true

  # Not in the shipped stack; the temporal profile reads questions with it.
  duckling:
    type: extract
    url: http://plugin-duckling:8000/invoke
    health_url: http://plugin-duckling:8000/health
    timeout: 60
    retries: 0
    optional: true
    json_input: leaves

  # The shipped time reader (retrieval_v1 and timeline_v1).
  chrono:
    type: extract
    url: http://plugin-chrono:8000/invoke
    health_url: http://plugin-chrono:8000/health
    timeout: 60
    retries: 0
    optional: true
