# The model gateway's routes (LiteLLM). Restart the gateway service after a change.
# Details: https://everythingmemory.ai/docs/configuration/embeddings/

model_list:
  # The default: nomic-embed-text on this machine (the local-embed service).
  - model_name: nomic-embed-text
    litellm_params:
      model: openai/nomic-embed-text
      api_base: http://local-embed:8080/v1
      api_key: none
    model_info:
      mode: embedding
      output_vector_size: 768
      max_input_tokens: 2048
      document_prefix: "search_document: "
      query_prefix: "search_query: "

  # OpenRouter: needs OPENROUTER_API_KEY in gateway.env.
  - model_name: text-embedding-3-small
    litellm_params:
      model: openrouter/openai/text-embedding-3-small
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      mode: embedding
      output_vector_size: 1536
      max_input_tokens: 8192

litellm_settings:
  drop_params: true
  num_retries: 2
  request_timeout: 120
