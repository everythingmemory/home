# The scheduled jobs (run only with CRON_ENABLED=true).
# Details: https://everythingmemory.ai/docs/configuration/workers/

# Every hour at :00, and at start.
task_embedding_sweep:
  minute: 0
  run_at_startup: true

# Every hour at :00, and at start.
task_tagging_sweep:
  minute: 0
  run_at_startup: true

# Every 5 minutes, and at start.
task_sync_sweep:
  minute: [0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55]
  run_at_startup: true

# Every 5 minutes.
task_sync_peers:
  minute: [0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55]

# Every 5 minutes, two after the sync sweep.
task_archive_audit:
  minute: [2, 7, 12, 17, 22, 27, 32, 37, 42, 47, 52, 57]
