# The pipeline profile PIPELINE_PROFILE selects: one component list per MCP call.
# Details: https://everythingmemory.ai/docs/reference/advanced-settings/profiles/

profile_v1:
  # e_ingest.
  ingest:
    components: [validate, persist, agent_properties, plugin_wordnet, plugin_chrono, embed, archive]
  # e_gather find.
  gather_find:
    components: [tokenize_query, tag_property_retrieve, tsquery_retrieve, semantic,
                 window_semantic, window_expand, true_distance_balanced_dedup,
                 slice_page, load_srs, format_output]
  # e_gather intersect, union and traverse.
  gather:
    components: [gather_resolve, order_using_context, slice_page, load_srs, format_output]
  # e_timeline list, intersect and traverse; the question's dates are read by chrono.
  timeline:
    components: [temporal_parse_v2, tag_temporal_resolve, tag_temporal_shed,
                 load_srs_with_tags, tag_temporal_order, slice_page, format_output]
  # The same, with is_conversational_only.
  timeline_conversational:
    components: [temporal_parse_v2, tag_temporal_resolve, tag_temporal_shed,
                 discourse_filter, load_srs_with_tags, tag_temporal_order, slice_page, format_output]
  # e_timeline find.
  timeline_find:
    components: [tokenize_query, tag_property_retrieve, tsquery_retrieve, semantic,
                 window_semantic, window_expand, true_distance_balanced_dedup,
                 load_srs_with_tags, tag_temporal_order, slice_page, format_output]

  tag_property_retrieve:
    max_candidates: 200
  semantic:
    max_srs: 200
  window_semantic:
    max_srs: 400
  tsquery_retrieve:
    max_candidates: 20
  true_distance_balanced_dedup:
    semantic: 40
    property: 35
    window: 20
    tsquery: 5
  tag_temporal_resolve:
    ceiling: 200
  slice_page:
    page_size: 30
  format_output:
    attribution_detail: 5
