# The log format and levels of the engine and its workers (LOG_LEVEL sets the root level).
# Details: https://everythingmemory.ai/docs/configuration/logging/

version: 1
disable_existing_loggers: false

filters:
  call_id:
    (): core.call_id.CallIdFilter
  failed_requests_only:
    (): core.log_setup.FailedRequestsOnly

formatters:
  standard:
    format: "%(asctime)s  %(call_id)-10s %(levelname)-6s %(module)-30s %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    formatter: standard
    stream: ext://sys.stderr
    filters: [call_id]

root:
  level: INFO
  handlers: [console]

loggers:
  uvicorn:
    handlers: [console]
    propagate: false
  uvicorn.error:
    handlers: [console]
    propagate: false
  # Failed requests only (status 400 and above).
  uvicorn.access:
    filters: [failed_requests_only]
    handlers: [console]
    propagate: false

  arq:
    handlers: [console]
    propagate: false
  # The sweeps log their own work; the per-job framework lines are off.
  arq.worker:
    level: WARNING

  httpx:
    level: WARNING
  httpcore:
    level: WARNING
  alembic.runtime.plugins:
    level: WARNING
  hpack:
    level: WARNING
  core.middleware:
    level: WARNING
