# Tuning profiles — measurement arms, not shipped defaults.
#
# NOTHING LOADS THIS FILE. `core/services/pipeline/config.py` reads exactly one
# file, `profiles.yaml`, through `core.conf.resolve` — so a stanza here is a
# RECIPE, and an operator installs it by putting it in the profiles.yaml the
# engine resolves:
#
#   1. mount a directory and set CONF_OVERRIDE_DIR to it (core/conf.py:33 —
#      the override wins over the image's conf/ for any file by name);
#   2. copy the image's conf/profiles.yaml into CONF_OVERRIDE_DIR/profiles.yaml
#      and append the stanza below to it (the whole file is replaced, not
#      merged, so it must carry the shipped profiles too);
#   3. set PIPELINE_PROFILE to the tuning profile's name and restart.
#
# The shipped profiles.yaml is never edited for a measurement, and the rollback
# is PIPELINE_PROFILE back to the shipped name.

# ---: the ROW-side arms — the readers that read `property_cache` ----
#
# THE CONTROL ARM. The shipped profiles read a derived property from `tag_cache`;
# these two are those profiles with the ROW-side name substituted back, so a
# stack can be asked the same question through the rows it used to read. Each is
# its shipped sibling with COMPONENT NAMES SUBSTITUTED and nothing else
# different — same prerequisites, same ratios, same page size, same ingestion
# stanza — so a difference in the page is a difference in the lookup and nothing
# else. The ingestion stanza is carried deliberately: `extracted_schemas` reads
# it to tell a derived schema from a declared one, and every probe on either
# side is defined by that set.
#
# TWO, NOT THREE: `gather` names no tag-side component, so it has no arm. Its
# loader is `load_srs` because the only reader of `tag_cache.temporal` is
# `tag_temporal_order`, which that pipeline does not run; `gather_resolve` reads
# rows; and the other readers of a declared property — `e_property`,
# `e_gather count/group`, the facet catalog, the console — read AGENT rows and
# are no arm's business. A stanza identical to the shipped profile would be a
# duplicate pretending to be a measurement. When a tag-side component does land
# in `gather`, its row-side sibling belongs here.
#
#   tag_property_retrieve  → property_retrieve   the pool
#   tag_temporal_resolve   → temporal_resolve    the content-time filter and
#   tag_temporal_shed      → temporal_shed       `match=`, and the counts that
#   tag_temporal_order     → temporal_order      decide what to shed
#   load_srs_with_tags     → load_srs            `tag_cache.temporal`, which is
#                                                the sort key
#
# THEY READ `property_cache` ROWS, AND NOTHING MINTS AN EXTRACTED ONE (v47
#(d2)). An ingest writes the index (`tag_cache`) and no extracted row, and
# the engine deletes none: the tagging sweep counts and enqueues only, and its
# census line is `records / present / missing_or_behind / enqueued`. So on a
# stack that carries no extracted rows the pool arm answers from
# `agent_property` rows only — without the lemma half of its hits — and the
# temporal arms have no dated match. They are a CONTROL for a measurement taken
# on a corpus that HAS extracted rows, never a rollback: the rollback is
# re-derive, and re-derive reads content, which needs no row. They stay
# registered and selectable because the pipeline is a menu.
#
# The temporal arm below is selected by name through TEMPORAL_PROFILE (the
# block e_timeline runs), the curate arms through PIPELINE_PROFILE; both are
# installed by the one-file replacement the header describes.

agentic_eval_v1_rows:
  curate:
    components: [tokenize_query, property_retrieve, tsquery_retrieve, semantic,
                 window_semantic, window_expand, true_distance_balanced_dedup,
                 slice_page, load_srs, format_output]
  ingestion:
    components: [validate, persist, agent_properties, plugin_wordnet, plugin_duckling, plugin_json_leaf, embed, archive]
    allow_any_source_type: true
  property_retrieve:
    max_candidates: 200
  semantic:
    max_srs: 200
  window_semantic:
    max_srs: 400
  tsquery_retrieve:
    max_candidates: 20
  true_distance_balanced_dedup:
    semantic: 40
    property: 35
    window: 20
    tsquery: 5
  slice_page:
    page_size: 30
  format_output:
    attribution_detail: 5

# agentic_eval_v2 with the row-side names substituted back (its control arm).
agentic_eval_v2_rows:
  curate:
    components: [tokenize_query, property_retrieve, tsquery_retrieve, semantic,
                 window_semantic, window_expand, true_distance_balanced_dedup,
                 slice_page, load_srs, format_output]
  ingestion:
    components: [validate, persist, agent_properties, plugin_wordnet, plugin_duckling, embed, archive]
    allow_any_source_type: true
  property_retrieve:
    max_candidates: 200
  semantic:
    max_srs: 200
  window_semantic:
    max_srs: 400
  tsquery_retrieve:
    max_candidates: 20
  true_distance_balanced_dedup:
    semantic: 40
    property: 35
    window: 20
    tsquery: 5
  slice_page:
    page_size: 30
  format_output:
    attribution_detail: 5

# --- the row-side temporal arm (e_timeline) ----------------------------------
#
# `temporal` with its three readers and its loader swapped back. The resolver's
# content-time filter becomes the `ep_class` / `ep_datetime` / `ep_grain` CASE
# over declared rows and its `match=` the substring arm; the shed counts that
# arm; the order sorts on the `ep_map`'s min/max, which `load_srs` carries.
#
# THE DECLARED DIFFERENCES IN THE PAGE. What a STORED match
# spans is the ruling's subject; how wide a QUESTION is was never in dispute,
# and the two arms widen one identically — sub-day grains included.
#
#   1. A day-grain match is an INSTANT at its own moment here and spans its day
#      on the tag side: `_filter_by_content_time`'s CASE widens `year`,
#      `quarter`, `month` and `week` only. So a window INSIDE a day returns
#      records on the shipped profile that this arm does not.
#   2. A month-grain match spans a fixed 31 days here and its CALENDAR month on
#      the tag side, so THIS arm returns a February record for a window in early
#      March and the shipped profile does not. A month is its own month.
#   3. `match=` with a lemma is matched by substring here and exactly on the
#      tag side.
#   4. A LABELLED `match=` spec probes the label's own rows here; the tag side
#      probes the labelled element AND the bare one — a lexname is WordNet's own
#      label and `tags` stores none, so the lemma is the bridge — which also
#      matches a record carrying that value under no label at all.

temporal_rows:
  temporal:
    components: [temporal_parse, temporal_resolve, temporal_shed,
                 load_srs, temporal_order, slice_page, format_output]
  temporal_discourse:
    components: [temporal_parse, temporal_resolve, temporal_shed,
                 discourse_filter, load_srs, temporal_order, slice_page, format_output]
  temporal_find:
    components: [tokenize_query, property_retrieve, tsquery_retrieve, semantic,
                 window_semantic, window_expand, true_distance_balanced_dedup,
                 load_srs, temporal_order, slice_page, format_output]
  temporal_resolve:
    ceiling: 200
  property_retrieve:
    max_candidates: 200
  semantic:
    max_srs: 200
  window_semantic:
    max_srs: 400
  tsquery_retrieve:
    max_candidates: 20
  true_distance_balanced_dedup:
    semantic: 40
    property: 35
    window: 20
    tsquery: 5
  slice_page:
    page_size: 30
  format_output:
    attribution_detail: 5

# There is no gather arm — see the header. `gather` names no tag-side
# component, so its control arm is the shipped profile itself.
