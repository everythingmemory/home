# The lanes and agent profiles a new engine starts with, and its default profile.
# Details: https://everythingmemory.ai/docs/governance/agent-profiles/
default_agent_profile: restricted
lanes:
  default:
    vocabulary: open
    allowed_labels: null
    builtin: true
agent_profiles:
  open:
    home_lane: default
    can_read_any_lane: true
    can_write_any_lane: true
    enabled: true
  restricted:
    home_lane: default
    can_read_any_lane: true
    can_write_any_lane: false
    enabled: true
    builtin: true
